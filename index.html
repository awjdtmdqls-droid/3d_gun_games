<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D 1v1 FPS Rival Shooter</title>
  
  <!-- PeerJS 라이브러리 (P2P 통신용 필수 CDN) -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <!-- Three.js (3D 그래픽 엔진) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { width: 100vw; height: 100vh; overflow: hidden; background: #08080c; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #fff; }
    canvas { display: block; width: 100%; height: 100%; }

    /* UI 레이어 공통 스타일 */
    .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; justify-content: center; align-items: center; }
    .interactive { pointer-events: auto; }

    /* 로비 & 메뉴 카드 */
    .card { background: rgba(18, 18, 26, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; padding: 32px; width: 400px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.6); }
    .card h2 { font-size: 26px; margin-bottom: 8px; color: #00ffcc; text-transform: uppercase; letter-spacing: 1px; }
    .card p.desc { font-size: 13px; color: #8a8a9e; margin-bottom: 24px; }

    /* 버튼 및 입력창 */
    .action-btn { width: 100%; padding: 14px; border: none; border-radius: 8px; background: linear-gradient(135deg, #00ffcc, #0099ff); color: #000; font-weight: bold; font-size: 15px; cursor: pointer; transition: all 0.2s ease; margin-bottom: 10px; }
    .action-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0, 255, 204, 0.4); }
    .action-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
    .action-btn.secondary { background: #252533; color: #fff; border: 1px solid rgba(255,255,255,0.1); }
    .action-btn.secondary:hover { background: #323246; }
    .action-btn.danger { background: #ff4757; color: #fff; }

    input[type="text"] { width: 100%; padding: 12px; background: #12121a; border: 1px solid #333; border-radius: 8px; color: #fff; text-align: center; font-size: 16px; margin-bottom: 10px; outline: none; }
    input[type="text"]:focus { border-color: #00ffcc; }

    /* 크로스헤어 */
    #crosshair { position: absolute; top: 50%; left: 50%; width: 10px; height: 10px; border: 2px solid rgba(0, 255, 204, 0.8); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; display: none; }

    /* 상단 스코어보드 & 조작 팁 */
    #score-board { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.6); padding: 8px 24px; border-radius: 20px; font-weight: bold; font-size: 18px; border: 1px solid rgba(255,255,255,0.1); display: none; }
    #controls-tip { position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.5); padding: 12px; border-radius: 8px; font-size: 12px; color: #aaa; pointer-events: none; display: none; }

    /* 하단 HUD */
    #hud-bottom-left { position: absolute; bottom: 20px; left: 20px; display: none; pointer-events: none; width: 260px; }
    .status-tags-container { display: flex; gap: 8px; margin-bottom: 8px; }
    .status-tag { display: none; padding: 4px 8px; background: rgba(0,0,0,0.7); border-radius: 4px; font-size: 11px; font-weight: bold; }
    #invincible-tag { color: #ffd700; border: 1px solid #ffd700; }
    #stealth-tag { color: #a855f7; border: 1px solid #a855f7; }

    .stat-bars-card, .weapon-info-card { background: rgba(18, 18, 26, 0.75); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 12px; margin-top: 6px; }
    .bar-label { display: flex; justify-content: space-between; font-size: 11px; color: #aaa; margin-bottom: 4px; }
    .hp-container, .shield-container { width: 100%; height: 8px; background: #1a1a24; border-radius: 4px; overflow: hidden; }
    .hp-bar-fill { width: 100%; height: 100%; background: #ff4757; transition: width 0.2s; }
    .shield-bar-fill { width: 100%; height: 100%; background: #00d2d3; transition: width 0.2s; }

    .weapon-row { display: flex; justify-content: space-between; align-items: center; }
    .weapon-name { font-size: 13px; font-weight: bold; color: #00ffcc; }
    .ammo-count { font-size: 14px; font-weight: bold; }

    /* 일시정지 메뉴 */
    #ingame-menu { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 100; }
  </style>
</head>
<body>

  <!-- 크로스헤어 & 중앙 조준점 -->
  <div id="crosshair"></div>

  <!-- 상단 스코어 보드 -->
  <div id="score-board">
    나 <span id="my-score">0</span> : <span id="enemy-score">0</span> 상대
  </div>

  <!-- 우상단 조작법 안내 -->
  <div id="controls-tip">
    [WASD] 이동 | [Space] 플로팅 점프<br>
    [Q] 메뉴 / 마우스 커서 | [좌클릭] 사격
  </div>

  <!-- 메인 게임 UI 레이어 (로비) -->
  <div class="ui-layer" id="main-lobby-layer">
    <div class="card interactive">
      <h2>3D 1v1 FPS Rival Shooter</h2>
      <p class="desc">Floating Jump & Portal Gun (P2P 멀티플레이어)</p>
      
      <!-- [섹션 1] 방 만들기 (팀코드 발급) -->
      <div style="margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 18px;">
        <button class="action-btn" id="btn-make-room">새로운 게임방 생성</button>
        <div id="room-code-area" style="margin-top: 12px; font-size: 16px; color: #00ffcc; display: none;">
          전달할 팀코드 4자리: 
          <span id="txt-room-code" style="font-size: 22px; color: #fff; background: #1a1a24; padding: 4px 14px; border-radius: 6px; border: 1px solid #00ffcc; margin-left: 5px; letter-spacing: 1px;">0000</span>
        </div>
      </div>

      <!-- [섹션 2] 방 참가하기 (팀코드 입력) -->
      <div>
        <input type="text" id="input-room-code" placeholder="친구의 팀코드 4자리 입력" maxlength="4">
        <button class="action-btn secondary" id="btn-enter-room">게임방 참가하기</button>
      </div>
    </div>
  </div>

  <!-- 인게임 메뉴 (Q키 대응) -->
  <div id="ingame-menu" class="card interactive">
    <h2>게임 일시정지</h2>
    <p class="desc">대기실로 돌아가거나 설정을 변경합니다.</p>
    <button class="action-btn danger" onclick="location.reload()">대기실로 나가기</button>
  </div>

  <!-- 하단 HUD 스태츠 영역 -->
  <div id="hud-bottom-left">
    <div class="status-tags-container">
      <div id="invincible-tag" class="status-tag">🛡️ 무적 상태</div>
      <div id="stealth-tag" class="status-tag">👤 은신 상태</div>
    </div>
    <div class="stat-bars-card">
      <div class="bar-label"><span>체력 (HP)</span><span id="txt-hp">100</span></div>
      <div class="hp-container"><div id="bar-hp" class="hp-bar-fill"></div></div>
      <div class="bar-label" style="margin-top: 6px;"><span>보호막 (SHIELD)</span><span id="txt-shield">100</span></div>
      <div class="shield-container"><div id="bar-shield" class="shield-bar-fill"></div></div>
    </div>
    <div class="weapon-info-card">
      <div class="weapon-row">
        <span class="weapon-name" id="txt-weapon">주무기 (Rifle)</span>
        <span class="ammo-count" id="txt-ammo">30 / ∞</span>
      </div>
    </div>
  </div>

  <!-- 🎮 멀티플레이어 매칭 스크립트 -->
  <script>
    let peer = null;
    let conn = null;
    const ROOM_PREFIX = "fps_rival_"; // 다른 게임방과의 충돌 방지용 접두사

    // 4자리 임의의 숫자 코드 생성 함수
    function makeRandomCode() {
      return Math.floor(1000 + Math.random() * 9000).toString();
    }

    // [방장 역할] 방 생성 버튼 이벤트
    document.getElementById('btn-make-room').addEventListener('click', () => {
      const generatedCode = makeRandomCode();
      
      // PeerJS 클라우드 서버에 고유 ID로 등록 (사설 IP 우회)
      peer = new Peer(ROOM_PREFIX + generatedCode);

      document.getElementById('btn-make-room').disabled = true;
      document.getElementById('btn-make-room').innerText = "접속 대기 중...";

      peer.on('open', (id) => {
        console.log("PeerJS 클라우드 방 생성 성공 ID:", id);
        document.getElementById('room-code-area').style.display = 'block';
        document.getElementById('txt-room-code').innerText = generatedCode;
      });

      // 게스트가 4자리 코드로 접속을 시도하여 나에게 도달했을 때
      peer.on('connection', (incomingConn) => {
        conn = incomingConn;
        startMultiplayerSession();
      });

      peer.on('error', (err) => {
        alert("방 생성 실패: 이미 사용 중인 코드이거나 일시적인 네트워크 오류입니다.");
        location.reload();
      });
    });

    // [게스트 역할] 방 참가 버튼 이벤트
    document.getElementById('btn-enter-room').addEventListener('click', () => {
      const inputCode = document.getElementById('input-room-code').value.trim();
      
      if (inputCode.length !== 4 || isNaN(inputCode)) {
        alert("정확한 숫자 4자리를 입력해 주세요.");
        return;
      }

      // 게스트는 랜덤 ID로 클라우드 접속 후, 방장의 4자리 코드로 연결 요청
      peer = new Peer();

      document.getElementById('btn-enter-room').disabled = true;
      document.getElementById('btn-enter-room').innerText = "방 찾는 중...";

      peer.on('open', (id) => {
        console.log("게스트 클라이언트 생성 성공. 방장 연결 시도...");
        conn = peer.connect(ROOM_PREFIX + inputCode);
        startMultiplayerSession();
      });

      peer.on('error', (err) => {
        alert("연결 중 문제가 발생했습니다.");
        location.reload();
      });
    });

    // P2P 연결 성공 후 인게임 진입 처리
    function startMultiplayerSession() {
      conn.on('open', () => {
        console.log("💥 상대방과 P2P 직통 연결 성공!");
        
        // 메인 로비 UI 완전히 숨기고 인게임 HUD 활성화
        document.getElementById('main-lobby-layer').style.display = 'none';
        document.getElementById('score-board').style.display = 'block';
        document.getElementById('crosshair').style.display = 'block';
        document.getElementById('controls-tip').style.display = 'block';
        document.getElementById('hud-bottom-left').style.display = 'block';

        // 포인터 락(마우스 잠금) 및 Three.js 메인 루프 실행 코드 연결 위치
        initGameEngine();
      });

      // 실시간 데이터 수신 (상대방 좌표, 총기 발사, 포탈 생성 상태 등)
      conn.on('data', (data) => {
        console.log("수신된 게임 데이터:", data);
      });

      conn.on('close', () => {
        alert("상대 플레이어와 연결이 끊어졌습니다.");
        location.reload();
      });
    }

    // Three.js 게임 실행용 초기화 함수
    function initGameEngine() {
      console.log("Three.js FPS 월드 로딩 시작...");
      
      // 마우스 포인터 락
      document.body.requestPointerLock = document.body.requestPointerLock || document.body.mozRequestPointerLock;
      document.body.requestPointerLock();
    }

    // Q키 누르면 인게임 메뉴 켜고 끄기 기본 구현
    window.addEventListener('keydown', (e) => {
      if (e.key.toLowerCase() === 'q') {
        const menu = document.getElementById('ingame-menu');
        if (menu.style.display === 'block') {
          menu.style.display = 'none';
          document.body.style.cursor = 'none';
        } else if (document.getElementById('main-lobby-layer').style.display === 'none') {
          menu.style.display = 'block';
          document.body.style.cursor = 'default';
        }
      }
    });
  </script>
</body>
</html>
